# Salin ke /etc/nginx/sites-available/api-dev.keyloka.com lalu:
#   sudo ln -s /etc/nginx/sites-available/api-dev.keyloka.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sesuaikan baris ssl_certificate* dengan yang dipakai config production (api.keyloka.com),
# mis. Cloudflare Origin Certificate atau Let's Encrypt. Upstream dev = 127.0.0.1:3002.

server {
    listen 80;
    server_name api-dev.keyloka.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-dev.keyloka.com;

    ssl_certificate     /etc/ssl/cloudflare/keyloka.com.pem;      # SESUAIKAN
    ssl_certificate_key /etc/ssl/cloudflare/keyloka.com.key;      # SESUAIKAN

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
