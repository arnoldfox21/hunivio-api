# Stack DEV - terpisah dari production (menggunakan Cloud Database Prisma Postgres via DATABASE_URL di .env.dev).
# Pakai: docker compose -f docker-compose.dev.yml up -d
services:
  api:
    image: ${DOCKER_IMAGE:-keyloka-api:dev}
    container_name: keyloka-dev-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_PORT:-3002}:3001"
    env_file:
      - .env.dev
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-keyloka_dev}}
    volumes:
      - uploads_dev:/app/uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata_dev:
  uploads_dev:
