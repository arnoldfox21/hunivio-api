services:
  postgres:
    image: postgres:16-alpine
    container_name: hunivio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hunivio_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hunivio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKER_IMAGE:-hunivio-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunivio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hunivio_db}}
    volumes:
      - uploads_data:/app/uploads
      # Uncomment jika file firebase-service-account.json sudah ada di VPS:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

volumes:
  pgdata:
  uploads_data:
